<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Glitchscope</title>
  <desc>A neon audio waveform inside an open oscilloscope ring shaped like a G.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#192337"/>
      <stop offset="1" stop-color="#090d18"/>
    </linearGradient>
    <linearGradient id="signal" x2="1" y2="0">
      <stop stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#8deeff"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="52" fill="url(#background)"/>
  <!-- The open ring and its inward bar form the initial G. -->
  <path d="M190 72a84 84 0 1 0 22 76h-38"
        fill="none" stroke="url(#signal)" stroke-width="16" stroke-linecap="square"/>
  <!-- A small displaced echo gives the signal its glitch accent. -->
  <path d="M65 136h24l17-34 25 68 23-54 13 20h31"
        fill="none" stroke="#ff4d91" stroke-width="12" stroke-linejoin="round"/>
  <path d="M57 126h24l17-34 25 68 23-54 13 20h31"
        fill="none" stroke="#e5fcff" stroke-width="12" stroke-linejoin="round"/>
  <path d="M194 88h22" stroke="#ff4d91" stroke-width="12"/>
</svg>
