version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - fatcontext
    - gocritic
    - misspell
    - nilerr
    - unused
  settings:
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    gocritic:
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - ifElseChain
        - dupSubExpr
      enabled-tags:
        - diagnostic
        - performance
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gocritic
        path: _test\.go
      # Keep explicit embedded-state selectors readable at call sites.
      - linters:
          - staticcheck
        text: "QF1008"
      # A single-kind conditional is clearer than introducing a switch here.
      - linters:
          - staticcheck
        text: "QF1003"
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
