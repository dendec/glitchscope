name: GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "scripts/build-site.py"
      - "portmaster/screenshot.png"
      - "internal/ui/app_icon.svg"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "scripts/build-site.py"
      - "portmaster/screenshot.png"
      - "internal/ui/app_icon.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build static pages and validate translations
        run: python3 scripts/build-site.py
      - name: Check browser script syntax
        run: node --check site/site.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
